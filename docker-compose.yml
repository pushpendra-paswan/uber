services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # No healthcheck (the image has no curl) and not in the backend's depends_on: the backend
  # must start without it. Run osrm/prepare.sh once first, otherwise this container exits.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.10.0-debian
    command: osrm-routed --algorithm mld /data/city.osrm
    volumes:
      - ./osrm/data:/data:ro
    ports:
      - "127.0.0.1:5000:5000"

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
      # A second uvicorn process is started by hand for the two-process stress runs (see README).
      - "127.0.0.1:8001:8001"
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --ws-max-size 65536 --reload

volumes:
  postgres_data:
